        function inferAttachmentTypeFromId(id) {
            const upper = (id || "").toUpperCase();
            if (upper.startsWith("LBT")) return "LOW BED TRUCK";
            if (upper.startsWith("HBT")) return "HIGH BED TRUCK";
            if (upper.startsWith("BCT")) return "BULK CEMENT TRUCK";
            if (upper.startsWith("DLY") || upper.startsWith("DL")) return "DOLLY";
            if (upper.startsWith("HB-")) return "HYDRAULIC BREAKER";
            if (upper.startsWith("SPD")) return "SHEET PILE DRIVER";
            if (upper.startsWith("VH")) return "VIBRO HAMMER";
            return "LOW BED TRUCK";
        }

        function migrateLegacyRecords(rawState) {
            const defaults = buildDefaultFleetState();
            const migratedMap = new Map();

            defaults.forEach(defRow => {
                migratedMap.set(defRow.type, {
                    category: defRow.category,
                    type: defRow.type,
                    released: [],
                    restored: [],
                    waiting: [],
                    pms: [],
                    ongoing: [],
                    jobout: []
                });
            });

            rawState.forEach(row => {
                const buckets = ['released', 'restored', 'waiting', 'pms', 'ongoing', 'jobout'];
                if (row.type === "ATTACHMENTS") {
                    buckets.forEach(bKey => {
                        (row[bKey] || []).forEach(u => {
                            const specificType = inferAttachmentTypeFromId(u.id);
                            if (!migratedMap.has(specificType)) {
                                migratedMap.set(specificType, {
                                    category: "ATTACHMENT",
                                    type: specificType,
                                    released: [], restored: [], waiting: [], pms: [], ongoing: [], jobout: []
                                });
                            }
                            migratedMap.get(specificType)[bKey].push(u);
                        });
                    });
                } else {
                    const mappedCat = TYPE_GROUP_MAP[row.type] || (row.category === "Prime Equipment" ? "LIGHT EQUIPMENT" : (row.category === "Others" ? "ATTACHMENT" : row.category)) || "LIGHT EQUIPMENT";
                    if (!migratedMap.has(row.type)) {
                        migratedMap.set(row.type, {
                            category: mappedCat,
                            type: row.type,
                            released: [], restored: [], waiting: [], pms: [], ongoing: [], jobout: []
                        });
                    }
                    const targetRow = migratedMap.get(row.type);
                    targetRow.category = mappedCat;
                    buckets.forEach(bKey => {
                        (row[bKey] || []).forEach(u => {
                            if (!targetRow[bKey].some(existing => existing.id === u.id)) {
                                targetRow[bKey].push(u);
                            }
                        });
                    });
                }
            });

            return Array.from(migratedMap.values());
        }

        function ensureStateIntegrity() {
            const today = getTodayDateString();
            const fourDaysAgo = getDaysAgoDateString(4);

            Object.entries(CATEGORY_EQUIPMENT_TYPES).forEach(([cat, types]) => {
                types.forEach(t => {
                    let existing = state.find(r => r.type === t);
                    if (!existing) {
                        state.push({
                            category: cat,
                            type: t,
                            released: [],
                            waiting: [],
                            ongoing: [],
                            restored: [],
                            jobout: [],
                            pms: []
                        });
                    } else {
                        existing.category = cat;
                    }
                });
            });

            state.forEach(row => {
                if (!row.category) row.category = TYPE_GROUP_MAP[row.type] || "LIGHT EQUIPMENT";
                if (!row.released) row.released = [];
                if (!row.restored) row.restored = [];
                if (!row.waiting) row.waiting = [];
                if (!row.pms) row.pms = [];
                if (!row.ongoing) row.ongoing = [];
                if (!row.jobout) row.jobout = [];

                // Ensure For Testing items have repairedDate & Long Down resolution metadata
                row.restored.forEach(u => {
                    if (!u.repairedDate) {
                        u.repairedDate = today;
                    }
                    if (typeof u.priorDowntimeDays !== 'number') {
                        u.priorDowntimeDays = u.downSince ? calculateDaysBetween(u.downSince, u.repairedDate) : 0;
                    }
                    if (typeof u.wasLongDown !== 'boolean') {
                        u.wasLongDown = u.priorDowntimeDays > LONG_DOWN_THRESHOLD_DAYS;
                    }
                    delete u.downSince;
                });

                // Ensure operational items are not flagged as down; preserve repaired log metadata if promoted from For Testing
                row.released.forEach(u => {
                    delete u.downSince;
                    if (u.isRepaired) {
                        if (!u.repairedDate) {
                            u.repairedDate = today;
                        }
                        if (typeof u.priorDowntimeDays !== 'number') {
                            u.priorDowntimeDays = 0;
                        }
                        if (typeof u.wasLongDown !== 'boolean') {
                            u.wasLongDown = u.priorDowntimeDays > LONG_DOWN_THRESHOLD_DAYS;
                        }
                    }
                });

                // Ensure down/reported items have a downSince date so >7d auto-flag works reliably
                ['waiting', 'pms', 'ongoing', 'jobout'].forEach(key => {
                    (row[key] || []).forEach(u => {
                        if (!u.downSince) {
                            u.downSince = fourDaysAgo;
                        }
                    });
                });
            });
        }

        async function fetchSheetData() {
            const badge = document.getElementById('syncStatusBadge');
            try {
                badge.textContent = "Syncing...";
                const cached = localStorage.getItem(LOCAL_STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);
                if (cached) {
                    state = migrateLegacyRecords(JSON.parse(cached));
                    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state));
                    badge.textContent = "Fleet Ledger Loaded";
                } else {
                    const response = await fetch(GOOGLE_SCRIPT_URL);
                    const data = await response.json();
                    if (Array.isArray(data) && data.length > 0 && data.some(r => r.type === "BOOM TRUCK" && (r.released?.some(u => u.id === "BT-06")))) {
                        state = migrateLegacyRecords(data);
                        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state));
                        badge.textContent = "Google Sheet Connected";
                    } else {
                        state = buildDefaultFleetState();
                        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state));
                        badge.textContent = "Fleet Ledger Ready";
                    }
                }
            } catch (e) {
                console.warn("Unable to fetch from Sheet DB, utilizing local persistence/default state.", e);
                const cached = localStorage.getItem(LOCAL_STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);
                state = cached ? migrateLegacyRecords(JSON.parse(cached)) : buildDefaultFleetState();
                badge.textContent = "Local Persistence Active";
            }
            ensureStateIntegrity();
            populateDynamicEquipmentTypes();
            renderDashboard();
        }

        async function saveToSheet() {
            const badge = document.getElementById('syncStatusBadge');
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state));
                badge.textContent = "Saving...";
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(state)
                });
                badge.textContent = "Synced & Saved";
            } catch (e) {
                console.error("Failed to commit updates to Google Sheets:", e);
                badge.textContent = "Saved Locally";
            }
        }

        function resetToDefaults() {
            openConfirmModal(
                "Reset LOGISTICS FLEET MONITORING",
                "Reset all asset numbers, categories, repair dates, monthly logs, downtime timestamps, and LED statuses back to the default logistics fleet monitoring baseline?",
                async () => {
                    localStorage.removeItem(LOCAL_STORAGE_KEY);
                    localStorage.removeItem(LEGACY_STORAGE_KEY);
                    state = buildDefaultFleetState();
                    activeStatusFilter = "all";
                    filterOnlyLongDown = false;
                    highlightedEquipmentType = null;
                    repairSectionFilter = "all";
                    repairedFilterMode = "month";
                    filterRepairedOnlyLongDown = false;
                    selectedRepairedDate = getTodayDateString();
                    selectedRepairedMonth = getCurrentMonthString();
                    document.getElementById('repairedDateInput').value = selectedRepairedDate;
                    document.getElementById('repairedMonthInput').value = selectedRepairedMonth;
                    syncRepairedModeUI();
                    ensureStateIntegrity();
                    populateDynamicEquipmentTypes();
                    updateFilterUI();
                    renderDashboard();
                    await saveToSheet();
                    showToast("Logistics Fleet Monitoring reset to default baseline.", "success");
                }
            );
        }

        function getMemsStatusFromStateKey(stateKey) {
            if (stateKey === 'released') return 'available';
            if (stateKey === 'restored') return 'restored';
            if (stateKey === 'waiting' || stateKey === 'pms') return 'reported';
            return 'down'; // ongoing or jobout
        }

        function getMemsStatusLabel(memsStatus) {
            const labels = {
                available: "Operational",
                reported: "Reported",
                down: "Down",
                restored: "For Testing"
            };
            return labels[memsStatus] || "Operational";
        }

        function toggleStatusFilter(status) {
            activeStatusFilter = (activeStatusFilter === status) ? "all" : status;
            updateFilterUI();
            renderDashboard();
        }

        function toggleLongDownFilter() {
            filterOnlyLongDown = !filterOnlyLongDown;
            updateFilterUI();
            renderDashboard();
        }

        function toggleTypeHighlight(equipType) {
            highlightedEquipmentType = (highlightedEquipmentType === equipType) ? null : equipType;
            updateFilterUI();
            renderDashboard();
        }

        function clearAllFilters() {
            activeStatusFilter = "all";
            filterOnlyLongDown = false;
            highlightedEquipmentType = null;
            document.getElementById('searchInput').value = '';
            document.getElementById('locationFilter').value = 'All Motorpools';
            updateFilterUI();
            renderDashboard();
        }

        function updateFilterUI() {
            ['available', 'reported', 'down', 'restored'].forEach(st => {
                const el = document.getElementById(`legend-${st}`);
                if (!el) return;
                if (activeStatusFilter === st) {
                    el.classList.add('active-filter');
                } else {
                    el.classList.remove('active-filter');
                }
            });

            const longDownBtn = document.getElementById('legend-longdown');
            if (longDownBtn) {
                if (filterOnlyLongDown) longDownBtn.classList.add('active-filter');
                else longDownBtn.classList.remove('active-filter');
            }

            const clearBtn = document.getElementById('clearFiltersBtn');
            const highlightTag = document.getElementById('activeHighlightTag');
            const hasSearch = document.getElementById('searchInput').value.trim() !== '';
            const hasLocation = document.getElementById('locationFilter').value !== 'All Motorpools';

            if (activeStatusFilter !== 'all' || filterOnlyLongDown || highlightedEquipmentType || hasSearch || hasLocation) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            const tags = [];
            if (highlightedEquipmentType) tags.push(`Type: ${highlightedEquipmentType}`);
            if (filterOnlyLongDown) tags.push(`Auto-Flag: Long Down >${LONG_DOWN_THRESHOLD_DAYS}d`);

            if (tags.length > 0) {
                highlightTag.textContent = tags.join(" • ");
                highlightTag.classList.remove('hidden');
            } else {
                highlightTag.classList.add('hidden');
            }
        }

        function renderDashboard() {
            ensureStateIntegrity();
            updateFilterUI();

            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            const locationVal = document.getElementById('locationFilter').value;

            let totalAvailable = 0;
            let totalReported = 0;
            let totalDown = 0;
            let totalRestored = 0;
            let totalLongDownCount = 0;

            const allUnitCards = [];
            const allRepairedEntries = [];
            const allActiveRepairEntries = [];

            state.forEach(row => {
                const buckets = [
                    { key: 'released', list: row.released || [], memsStatus: 'available' },
                    { key: 'restored', list: row.restored || [], memsStatus: 'restored' },
                    { key: 'waiting', list: row.waiting || [], memsStatus: 'reported' },
                    { key: 'pms', list: row.pms || [], memsStatus: 'reported' },
                    { key: 'ongoing', list: row.ongoing || [], memsStatus: 'down' },
                    { key: 'jobout', list: row.jobout || [], memsStatus: 'down' }
                ];

                buckets.forEach(bucket => {
                    bucket.list.forEach(u => {
                        const unitLoc = u.location || "GEM Motorpool";
                        if (locationVal !== "All Motorpools" && unitLoc !== locationVal) return;

                        const isActiveRepair = (bucket.memsStatus === 'down' || bucket.memsStatus === 'reported');
                        const daysDown = isActiveRepair ? calculateDaysDown(u.downSince) : 0;
                        const isLongDown = isActiveRepair && (daysDown > LONG_DOWN_THRESHOLD_DAYS);

                        if (bucket.memsStatus === 'available') totalAvailable++;
                        else if (bucket.memsStatus === 'reported') totalReported++;
                        else if (bucket.memsStatus === 'down') totalDown++;
                        else if (bucket.memsStatus === 'restored') totalRestored++;

                        if (isLongDown) totalLongDownCount++;

                        const repDate = u.repairedDate || '';
                        const repMonth = repDate.length >= 7 ? repDate.slice(0, 7) : '';
                        const priorDowntimeDays = typeof u.priorDowntimeDays === 'number' ? u.priorDowntimeDays : 0;
                        const wasLongDown = Boolean(u.wasLongDown) || priorDowntimeDays > LONG_DOWN_THRESHOLD_DAYS;
                        const isRepairedOperational = (bucket.memsStatus === 'available' && Boolean(u.isRepaired));

                        const record = {
                            id: u.id,
                            type: row.type,
                            category: row.category,
                            location: unitLoc,
                            stateKey: bucket.key,
                            memsStatus: bucket.memsStatus,
                            completion: u.completion ?? (bucket.memsStatus === 'available' || bucket.memsStatus === 'restored' ? 100 : 0),
                            description: u.description || '',
                            targetDate: u.targetDate || '',
                            downSince: u.downSince || '',
                            daysDown,
                            isLongDown,
                            repairedDate: repDate,
                            repairedMonth: repMonth,
                            wasLongDown,
                            priorDowntimeDays,
                            isRepaired: Boolean(u.isRepaired),
                            isRepairedOperational
                        };

                        // Collect For Testing (Blue LED) AND Repaired Operational (promoted from For Testing -> Operational) for Section 1
                        if (bucket.memsStatus === 'restored' || isRepairedOperational) {
                            allRepairedEntries.push(record);
                        }

                        // Collect Long Down & Running Repair records for Section 2
                        if (isActiveRepair) {
                            allActiveRepairEntries.push(record);
                        }

                        // Apply LED Wall filters
                        if (activeStatusFilter !== 'all' && bucket.memsStatus !== activeStatusFilter) return;
                        if (filterOnlyLongDown && !isLongDown) return;

                        if (searchVal) {
                            const matchId = u.id.toLowerCase().includes(searchVal);
                            const matchType = row.type.toLowerCase().includes(searchVal);
                            const matchCat = (row.category || '').toLowerCase().includes(searchVal);
                            const matchDesc = (u.description || '').toLowerCase().includes(searchVal);
                            if (!matchId && !matchType && !matchCat && !matchDesc) return;
                        }

                        allUnitCards.push(record);
                    });
                });
            });

            document.getElementById('count-pill-available').textContent = totalAvailable;
            document.getElementById('count-pill-reported').textContent = totalReported;
            document.getElementById('count-pill-down').textContent = totalDown;
            document.getElementById('count-pill-restored').textContent = totalRestored;
            document.getElementById('count-pill-longdown').textContent = totalLongDownCount;

            const wallFlagBadge = document.getElementById('wallLongDownFlagBadge');
            if (totalLongDownCount > 0) {
                wallFlagBadge.textContent = `${totalLongDownCount} Auto-Flagged >7d Down`;
                wallFlagBadge.classList.remove('hidden');
            } else {
                wallFlagBadge.classList.add('hidden');
            }

            const grandUnitsCount = totalAvailable + totalReported + totalDown + totalRestored;
            document.getElementById('totalMonitoredBadge').textContent = `${grandUnitsCount} Unit${grandUnitsCount === 1 ? '' : 's'} Monitored`;

            renderMemsTileWall(allUnitCards);
            renderMemsSummaryTable(state, locationVal);
            renderRepairedSection(allRepairedEntries, searchVal);
            renderLongDownRunningRepairSection(allActiveRepairEntries, searchVal);
            lucide.createIcons();
        }

        function showUnitTooltip(e, card) {
            const tooltip = document.getElementById('unitHoverTooltip');
            document.getElementById('ttAssetCode').textContent = card.id;
            document.getElementById('ttCategory').textContent = card.category;
            document.getElementById('ttEquipType').textContent = card.type;
            document.getElementById('ttLocation').textContent = card.location;
            document.getElementById('ttCompletion').textContent = `${card.completion}%`;
            document.getElementById('ttNotes').textContent = card.description || "Operational / No fault remarks";

            const longDownFlag = document.getElementById('ttLongDownFlag');
            const downtimeRow = document.getElementById('ttDowntimeRow');
            const downtimeVal = document.getElementById('ttDowntime');
            const repairedRow = document.getElementById('ttRepairedDateRow');
            const repairedVal = document.getElementById('ttRepairedDate');

            if (card.memsStatus === 'down' || card.memsStatus === 'reported') {
                downtimeRow.classList.remove('hidden');
                downtimeVal.textContent = `${card.daysDown} day${card.daysDown === 1 ? '' : 's'} (since ${card.downSince || 'N/A'})`;
                if (card.isLongDown) {
                    longDownFlag.classList.remove('hidden');
                    downtimeVal.className = "font-black text-rose-400 text-right";
                } else {
                    longDownFlag.classList.add('hidden');
                    downtimeVal.className = "font-bold text-amber-300 text-right";
                }
            } else {
                longDownFlag.classList.add('hidden');
                downtimeRow.classList.add('hidden');
            }

            if ((card.memsStatus === 'restored' || card.isRepairedOperational) && card.repairedDate) {
                repairedRow.classList.remove('hidden');
                repairedVal.textContent = `${formatFullDateWithMonth(card.repairedDate)} (${card.repairedDate})${card.wasLongDown ? ' • Was >7d Down' : ''}`;
            } else {
                repairedRow.classList.add('hidden');
            }

            const badge = document.getElementById('ttStatusBadge');
            badge.textContent = card.isRepairedOperational ? "Operational (Repaired)" : getMemsStatusLabel(card.memsStatus);
            const badgeStyles = {
                available: "bg-emerald-500/20 text-emerald-300 border border-emerald-500/40",
                reported: "bg-amber-500/20 text-amber-300 border border-amber-500/40",
                down: "bg-rose-500/20 text-rose-300 border border-rose-500/40",
                restored: "bg-blue-500/20 text-blue-300 border border-blue-500/40"
            };
            badge.className = `px-2 py-0.5 rounded-full text-[10px] font-bold uppercase ${badgeStyles[card.memsStatus] || badgeStyles.available}`;

            tooltip.classList.remove('hidden');
            moveUnitTooltip(e);
        }

        function moveUnitTooltip(e) {
            const tooltip = document.getElementById('unitHoverTooltip');
            if (tooltip.classList.contains('hidden')) return;
            const offset = 14;
            let left = e.clientX + offset;
            let top = e.clientY + offset;
            if (left + 295 > window.innerWidth) left = e.clientX - 300;
            if (top + 215 > window.innerHeight) top = e.clientY - 220;
            tooltip.style.left = `${Math.max(8, left)}px`;
            tooltip.style.top = `${Math.max(8, top)}px`;
        }

        function hideUnitTooltip() {
            document.getElementById('unitHoverTooltip').classList.add('hidden');
        }

        function renderMemsTileWall(cards) {
            const container = document.getElementById('memsTileColumnsContainer');
            const emptyMsg = document.getElementById('emptyWallMessage');
            container.innerHTML = '';

            if (cards.length === 0) {
                emptyMsg.classList.remove('hidden');
                return;
            }
            emptyMsg.classList.add('hidden');

            cards.sort((a, b) => {
                const idxA = ORDERED_EQUIPMENT_TYPES.indexOf(a.type);
                const idxB = ORDERED_EQUIPMENT_TYPES.indexOf(b.type);
                const pA = idxA !== -1 ? idxA : 999;
                const pB = idxB !== -1 ? idxB : 999;
                if (pA !== pB) return pA - pB;
                if (a.type !== b.type) return a.type.localeCompare(b.type);
                return a.id.localeCompare(b.id, undefined, { numeric: true, sensitivity: 'base' });
            });

            const numCols = 10;
            const itemsPerCol = Math.ceil(cards.length / numCols);

            for (let c = 0; c < numCols; c++) {
                const colSlice = cards.slice(c * itemsPerCol, (c + 1) * itemsPerCol);
                if (colSlice.length === 0) continue;

                const colDiv = document.createElement('div');
                colDiv.className = "flex flex-col gap-2";

                colSlice.forEach(card => {
                    const isHighlighted = highlightedEquipmentType === card.type;
                    const dimmed = highlightedEquipmentType && !isHighlighted ? 'opacity-30' : '';
                    const highlightCls = isHighlighted ? 'highlighted-type' : '';
                    const longDownCls = card.isLongDown ? 'long-down-flagged' : '';

                    const btn = document.createElement('button');
                    btn.type = "button";
                    btn.onmouseenter = (e) => showUnitTooltip(e, card);
                    btn.onmousemove = (e) => moveUnitTooltip(e);
                    btn.onmouseleave = () => hideUnitTooltip();
                    btn.onclick = () => {
                        hideUnitTooltip();
                        openManageModal(card.category, card.type, card.id, card.stateKey);
                    };
                    btn.className = `mems-unit-pill w-full px-2.5 py-1.5 flex items-center justify-between gap-1 text-left cursor-pointer ${longDownCls} ${highlightCls} ${dimmed}`;

                    const longDownBadgeHtml = card.isLongDown
                        ? `<span title="Long Down Repair: ${card.daysDown} days down (>7 days)" class="text-[9px] font-black px-1 py-0.2 rounded bg-rose-600 text-white leading-tight shrink-0">${card.daysDown}d!</span>`
                        : '';

                    btn.innerHTML = `
                        <span class="font-mono text-[11px] sm:text-xs font-bold text-slate-100 tracking-wide truncate">${card.id}</span>
                        <span class="flex items-center gap-1 shrink-0">
                            ${longDownBadgeHtml}
                            <span class="led-sphere led-${card.memsStatus}"></span>
                        </span>
                    `;
                    colDiv.appendChild(btn);
                });

                container.appendChild(colDiv);
            }
        }

        function renderMemsSummaryTable(rows, locationVal = "All Motorpools") {
            const tbody = document.getElementById('memsSummaryTableBody');
            tbody.innerHTML = '';

            const groups = [
                { name: "HEAVY EQUIPMENT", subtotalLabel: "HEAVY EQUIPMENT TOTAL" },
                { name: "LIGHT EQUIPMENT", subtotalLabel: "LIGHT EQUIPMENT TOTAL" },
                { name: "ATTACHMENT", subtotalLabel: "ATTACHMENT TOTAL" }
            ];

            let grandTotalUnits = 0;
            let grandTotalAvailable = 0;
            let grandTotalDown = 0;

            groups.forEach(group => {
                const canonicalOrder = CATEGORY_EQUIPMENT_TYPES[group.name] || [];
                const groupRows = rows
                    .filter(r => r.category === group.name)
                    .sort((a, b) => {
                        const iA = canonicalOrder.indexOf(a.type);
                        const iB = canonicalOrder.indexOf(b.type);
                        return (iA === -1 ? 999 : iA) - (iB === -1 ? 999 : iB);
                    });

                if (groupRows.length === 0) return;

                let subUnits = 0;
                let subAvailable = 0;
                let subDown = 0;

                groupRows.forEach((row, idx) => {
                    const filterLoc = (arr) => (arr || []).filter(u => locationVal === "All Motorpools" || (u.location || "GEM Motorpool") === locationVal);

                    const availableCount = filterLoc(row.released).length + filterLoc(row.restored).length;
                    const downCount = filterLoc(row.ongoing).length + filterLoc(row.jobout).length + filterLoc(row.waiting).length + filterLoc(row.pms).length;
                    const totalUnits = availableCount + downCount;
                    const availPct = totalUnits > 0 ? ((availableCount / totalUnits) * 100).toFixed(2) : "0.00";

                    subUnits += totalUnits;
                    subAvailable += availableCount;
                    subDown += downCount;

                    const tr = document.createElement('tr');
                    const isSelected = highlightedEquipmentType === row.type;
                    tr.className = `data-row transition ${isSelected ? 'selected-row' : ''}`;
                    tr.onclick = () => toggleTypeHighlight(row.type);

                    let categoryCellHtml = '';
                    if (idx === 0) {
                        categoryCellHtml = `<td rowspan="${groupRows.length}" class="category-cell align-top font-extrabold text-slate-900 bg-[#d8dce3] select-none tracking-wide">${group.name}</td>`;
                    }

                    tr.innerHTML = `
                        ${categoryCellHtml}
                        <td class="font-semibold">${row.type}</td>
                        <td class="text-center font-bold">${totalUnits}</td>
                        <td class="text-center font-bold text-emerald-800">${availableCount}</td>
                        <td class="text-center font-bold text-rose-800">${downCount}</td>
                        <td class="text-center font-extrabold">${availPct}%</td>
                    `;
                    tbody.appendChild(tr);
                });

                grandTotalUnits += subUnits;
                grandTotalAvailable += subAvailable;
                grandTotalDown += subDown;

                const subAvailPct = subUnits > 0 ? ((subAvailable / subUnits) * 100).toFixed(2) : "0.00";
                const subTr = document.createElement('tr');
                subTr.className = "subtotal-row";
                subTr.innerHTML = `
                    <td>${group.subtotalLabel}</td>
                    <td>${group.subtotalLabel}</td>
                    <td class="text-center">${subUnits}</td>
                    <td class="text-center">${subAvailable}</td>
                    <td class="text-center">${subDown}</td>
                    <td class="text-center">${subAvailPct}%</td>
                `;
                tbody.appendChild(subTr);
            });

            const grandAvailPct = grandTotalUnits > 0 ? ((grandTotalAvailable / grandTotalUnits) * 100).toFixed(2) : "0.00";
            const grandTr = document.createElement('tr');
            grandTr.className = "grandtotal-row";
            grandTr.innerHTML = `
                <td>GRAND TOTAL</td>
                <td>GRAND TOTAL</td>
                <td class="text-center">${grandTotalUnits}</td>
                <td class="text-center">${grandTotalAvailable}</td>
                <td class="text-center">${grandTotalDown}</td>
                <td class="text-center">${grandAvailPct}%</td>
            `;
            tbody.appendChild(grandTr);
        }

