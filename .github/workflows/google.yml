        function renderRepairedSection(allRepaired, searchVal = "") {
            const tbody = document.getElementById('repairedByDateTableBody');
            const emptyBox = document.getElementById('emptyRepairedDateMessage');
            const emptyTitle = document.getElementById('emptyRepairedTitle');
            const countBadge = document.getElementById('repairedCountBadge');
            const repairedOpBadge = document.getElementById('repairedOperationalCountBadge');
            const longDownResolvedBadge = document.getElementById('repairedLongDownResolvedBadge');
            const monthlyListContainer = document.getElementById('monthlyRepairedSummaryList');
            const spotlightTitle = document.getElementById('longDownRepairedSpotlightTitle');
            const spotlightCount = document.getElementById('longDownSpotlightCount');
            const spotlightGrid = document.getElementById('longDownRepairedSpotlightGrid');
            const emptySpotlightMsg = document.getElementById('emptyLongDownSpotlightMsg');

            // Base filtered by Equipment Type highlight & Search box
            const baseRepaired = allRepaired.filter(item => {
                if (highlightedEquipmentType && item.type !== highlightedEquipmentType) return false;
                if (searchVal) {
                    const match = item.id.toLowerCase().includes(searchVal) ||
                        item.type.toLowerCase().includes(searchVal) ||
                        item.category.toLowerCase().includes(searchVal) ||
                        item.description.toLowerCase().includes(searchVal);
                    if (!match) return false;
                }
                return true;
            });

            // Build Monthly Aggregation Cards
            const monthGroups = new Map();
            const currentMonth = getCurrentMonthString();
            monthGroups.set(currentMonth, { month: currentMonth, total: 0, repairedOp: 0, forTesting: 0, longDownResolved: 0 });
            if (selectedRepairedMonth && !monthGroups.has(selectedRepairedMonth)) {
                monthGroups.set(selectedRepairedMonth, { month: selectedRepairedMonth, total: 0, repairedOp: 0, forTesting: 0, longDownResolved: 0 });
            }

            baseRepaired.forEach(item => {
                const mKey = item.repairedMonth || currentMonth;
                if (!monthGroups.has(mKey)) {
                    monthGroups.set(mKey, { month: mKey, total: 0, repairedOp: 0, forTesting: 0, longDownResolved: 0 });
                }
                const entry = monthGroups.get(mKey);
                entry.total++;
                if (item.isRepairedOperational) entry.repairedOp++;
                else entry.forTesting++;
                if (item.wasLongDown) entry.longDownResolved++;
            });

            const sortedMonths = Array.from(monthGroups.values()).sort((a, b) => b.month.localeCompare(a.month));
            monthlyListContainer.innerHTML = '';

            sortedMonths.forEach(mObj => {
                const isActiveMonth = (repairedFilterMode === 'month' && selectedRepairedMonth === mObj.month) ||
                    (repairedFilterMode === 'date' && selectedRepairedDate.startsWith(mObj.month));

                const mBtn = document.createElement('button');
                mBtn.type = "button";
                mBtn.onclick = () => selectMonthFromSummaryCard(mObj.month);
                mBtn.className = isActiveMonth
                    ? "text-left p-2.5 rounded-lg bg-amber-500/20 border border-amber-400 shadow transition space-y-1"
                    : "text-left p-2.5 rounded-lg bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 transition space-y-1";

                mBtn.innerHTML = `
                    <div class="flex items-center justify-between gap-1">
                        <span class="text-[11px] font-black text-white truncate">${formatMonthLabel(mObj.month)}</span>
                        <span class="text-[10px] font-mono text-slate-400">${mObj.month}</span>
                    </div>
                    <div class="flex items-center justify-between text-[11px]">
                        <span class="font-extrabold text-emerald-300">${mObj.repairedOp} Repaired</span>
                        <span class="font-bold text-blue-300">${mObj.forTesting} Testing</span>
                    </div>
                `;
                monthlyListContainer.appendChild(mBtn);
            });

            // Period-filtered units
            const periodFiltered = baseRepaired.filter(item => {
                if (repairedFilterMode === 'date' && selectedRepairedDate) {
                    return item.repairedDate === selectedRepairedDate;
                }
                if (repairedFilterMode === 'month' && selectedRepairedMonth) {
                    return item.repairedMonth === selectedRepairedMonth;
                }
                return true;
            });

            // Long Down (>7d) Resolved Spotlight
            const periodLabel = repairedFilterMode === 'date'
                ? `${formatFullDateWithMonth(selectedRepairedDate)} (${selectedRepairedDate})`
                : (repairedFilterMode === 'month'
                    ? `${formatMonthLabel(selectedRepairedMonth)} (${selectedRepairedMonth})`
                    : "All Recorded Months");

            const resolvedLongDownInPeriod = periodFiltered
                .filter(i => i.wasLongDown)
                .sort((a, b) => (b.repairedDate || '').localeCompare(a.repairedDate || ''));

            spotlightTitle.textContent = `Long Down (>7d) Units Repaired / For Testing — ${periodLabel}`;
            spotlightCount.textContent = `${resolvedLongDownInPeriod.length} Unit${resolvedLongDownInPeriod.length === 1 ? '' : 's'}`;
            spotlightGrid.innerHTML = '';

            if (resolvedLongDownInPeriod.length === 0) {
                emptySpotlightMsg.classList.remove('hidden');
            } else {
                emptySpotlightMsg.classList.add('hidden');
                resolvedLongDownInPeriod.forEach(item => {
                    const ledCls = item.isRepairedOperational ? 'led-available' : 'led-restored';
                    const statePill = item.isRepairedOperational
                        ? `<span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">REPAIRED • OPERATIONAL</span>`
                        : `<span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-300 border border-blue-500/40">FOR TESTING</span>`;

                    const spotCard = document.createElement('div');
                    spotCard.onclick = () => openManageModal(item.category, item.type, item.id, item.stateKey);
                    spotCard.className = "bg-slate-900/90 hover:bg-slate-800 border border-emerald-500/40 rounded-lg p-2.5 cursor-pointer transition flex flex-col justify-between gap-1.5";
                    spotCard.innerHTML = `
                        <div class="flex items-center justify-between gap-1.5">
                            <div class="flex items-center gap-1.5">
                                <span class="led-sphere ${ledCls}" style="width:12px;height:12px;"></span>
                                <span class="font-mono font-black text-xs text-white">${item.id}</span>
                                <span class="text-[10px] font-bold text-slate-300">• ${item.type}</span>
                            </div>
                            <div class="flex items-center gap-1">
                                ${statePill}
                                <span class="text-[10px] font-black px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-300 border border-rose-500/40">Was ${item.priorDowntimeDays || '>7'}d Down</span>
                            </div>
                        </div>
                        <div class="flex flex-wrap items-center justify-between gap-1 text-[11px]">
                            <span class="text-emerald-300 font-bold">Repaired: ${formatFullDateWithMonth(item.repairedDate)} (${formatMonthLabel(item.repairedMonth)})</span>
                            <span class="text-amber-300/90 text-[10px] font-semibold">${item.location}</span>
                        </div>
                    `;
                    spotlightGrid.appendChild(spotCard);
                });
            }

            // Final Table Rows
            let tableFiltered = filterRepairedOnlyLongDown
                ? periodFiltered.filter(i => i.wasLongDown)
                : periodFiltered;

            tableFiltered.sort((a, b) => {
                if (a.repairedDate !== b.repairedDate) return (b.repairedDate || '').localeCompare(a.repairedDate || '');
                if (a.isRepairedOperational !== b.isRepairedOperational) return a.isRepairedOperational ? -1 : 1;
                if (a.wasLongDown !== b.wasLongDown) return a.wasLongDown ? -1 : 1;
                return a.id.localeCompare(b.id, undefined, { numeric: true, sensitivity: 'base' });
            });

            const repairedOpCount = tableFiltered.filter(i => i.isRepairedOperational).length;
            const forTestingCount = tableFiltered.length - repairedOpCount;

            countBadge.textContent = `${tableFiltered.length} Total (${forTestingCount} Testing, ${repairedOpCount} Repaired)`;
            repairedOpBadge.textContent = `${repairedOpCount} Repaired (Operational)`;
            longDownResolvedBadge.textContent = `${resolvedLongDownInPeriod.length} Long Down (>7d) Repaired`;
            tbody.innerHTML = '';

            if (tableFiltered.length === 0) {
                emptyBox.classList.remove('hidden');
                emptyTitle.textContent = `No repaired or for testing assets found for ${periodLabel}${filterRepairedOnlyLongDown ? ' (Long Down >7d Only filter active)' : ''}.`;
                return;
            }

            emptyBox.classList.add('hidden');

            tableFiltered.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = item.isRepairedOperational
                    ? "bg-emerald-950/25 hover:bg-emerald-950/40 transition cursor-pointer"
                    : (item.wasLongDown
                        ? "bg-blue-950/20 hover:bg-blue-950/35 transition cursor-pointer"
                        : "hover:bg-slate-800/70 transition cursor-pointer");
                tr.onclick = () => openManageModal(item.category, item.type, item.id, item.stateKey);

                const ledCls = item.isRepairedOperational ? 'led-available' : 'led-restored';
                const assetIdColorCls = item.isRepairedOperational ? 'text-emerald-300' : 'text-blue-300';

                const primaryStatusBadge = item.isRepairedOperational
                    ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-black bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">REPAIRED • OPERATIONAL</span>`
                    : `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-500/15 text-blue-300 border border-blue-500/30">FOR TESTING</span>`;

                const longDownTagHtml = item.wasLongDown
                    ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-black bg-amber-500/20 text-amber-300 border border-amber-500/40">LONG DOWN (>7d) RESOLVED</span>`
                    : '';

                const priorDowntimeHtml = item.priorDowntimeDays > 0
                    ? `<span class="font-extrabold ${item.wasLongDown ? 'text-rose-300' : 'text-slate-300'}">${item.priorDowntimeDays} day${item.priorDowntimeDays === 1 ? '' : 's'}</span>`
                    : `<span class="text-slate-500">—</span>`;

                tr.innerHTML = `
                    <td class="py-2.5 px-3 font-mono font-black ${assetIdColorCls}">
                        <div class="flex items-center gap-2">
                            <span class="led-sphere ${ledCls}" style="width:14px;height:14px;"></span>
                            <span>${item.id}</span>
                        </div>
                    </td>
                    <td class="py-2.5 px-3">
                        <div class="flex flex-wrap items-center gap-1.5">
                            ${primaryStatusBadge}
                            ${longDownTagHtml}
                        </div>
                    </td>
                    <td class="py-2.5 px-3 text-slate-300 font-medium">${item.category}</td>
                    <td class="py-2.5 px-3 text-white font-semibold">${item.type}</td>
                    <td class="py-2.5 px-3 text-amber-300 font-medium">${item.location}</td>
                    <td class="py-2.5 px-3">
                        <div class="font-mono font-bold text-emerald-300">${item.repairedDate || 'N/A'}</div>
                        <div class="text-[10px] font-semibold text-slate-400">${formatFullDateWithMonth(item.repairedDate)} • ${formatMonthLabel(item.repairedMonth)}</div>
                    </td>
                    <td class="py-2.5 px-3 text-center">${priorDowntimeHtml}</td>
                    <td class="py-2.5 px-3 text-slate-300">${item.description || (item.isRepairedOperational ? 'Repaired & Operational' : 'For Testing')}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Section 2: Long Down (>7d) & Running Repair Assets
        function setRepairSectionFilter(mode) {
            repairSectionFilter = mode;
            const tabAll = document.getElementById('repairTabAll');
            const tabLong = document.getElementById('repairTabLongDown');
            const tabRun = document.getElementById('repairTabRunning');

            tabAll.className = mode === 'all'
                ? "px-3 py-1 rounded-lg text-xs font-bold bg-blue-600 text-white transition"
                : "px-3 py-1 rounded-lg text-xs font-bold text-slate-300 hover:bg-slate-700 transition";

            tabLong.className = mode === 'long_down'
                ? "px-3 py-1 rounded-lg text-xs font-bold bg-rose-600 text-white transition"
                : "px-3 py-1 rounded-lg text-xs font-bold text-rose-300 hover:bg-rose-500/20 transition";

            tabRun.className = mode === 'running'
                ? "px-3 py-1 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 transition"
                : "px-3 py-1 rounded-lg text-xs font-bold text-amber-300 hover:bg-amber-500/20 transition";

            renderDashboard();
        }

        function renderLongDownRunningRepairSection(allActiveRepair, searchVal = "") {
            const grid = document.getElementById('longDownRunningGrid');
            const emptyBox = document.getElementById('emptyLongDownRunningMessage');

            const baseActive = allActiveRepair.filter(item => {
                if (highlightedEquipmentType && item.type !== highlightedEquipmentType) return false;
                if (searchVal) {
                    const match = item.id.toLowerCase().includes(searchVal) ||
                        item.type.toLowerCase().includes(searchVal) ||
                        item.category.toLowerCase().includes(searchVal) ||
                        item.description.toLowerCase().includes(searchVal);
                    if (!match) return false;
                }
                return true;
            });

            const longDownItems = baseActive.filter(i => i.isLongDown);
            const runningRepairItems = baseActive.filter(i => !i.isLongDown);

            document.getElementById('sectionLongDownBadge').textContent = `${longDownItems.length} Long Down (>7d)`;
            document.getElementById('sectionRunningRepairBadge').textContent = `${runningRepairItems.length} Running Repair`;
            document.getElementById('tabCountAll').textContent = baseActive.length;
            document.getElementById('tabCountLongDown').textContent = longDownItems.length;
            document.getElementById('tabCountRunning').textContent = runningRepairItems.length;

            let displayed = baseActive;
            if (repairSectionFilter === 'long_down') displayed = longDownItems;
            else if (repairSectionFilter === 'running') displayed = runningRepairItems;

            displayed.sort((a, b) => {
                if (a.isLongDown !== b.isLongDown) return a.isLongDown ? -1 : 1;
                if (b.daysDown !== a.daysDown) return b.daysDown - a.daysDown;
                return a.id.localeCompare(b.id, undefined, { numeric: true, sensitivity: 'base' });
            });

            grid.innerHTML = '';

            if (displayed.length === 0) {
                emptyBox.classList.remove('hidden');
                return;
            }
            emptyBox.classList.add('hidden');

            displayed.forEach(item => {
                const card = document.createElement('div');
                card.onclick = () => openManageModal(item.category, item.type, item.id, item.stateKey);
                card.className = item.isLongDown
                    ? "bg-rose-950/35 hover:bg-rose-950/50 border border-rose-500/50 rounded-xl p-3.5 transition cursor-pointer flex flex-col justify-between gap-2.5 shadow-md"
                    : "bg-slate-950/70 hover:bg-slate-800/80 border border-slate-700/80 rounded-xl p-3.5 transition cursor-pointer flex flex-col justify-between gap-2.5";

                const statusLabel = item.isLongDown
                    ? `LONG DOWN (>7d) • ${getMemsStatusLabel(item.memsStatus)}`
                    : `RUNNING REPAIR • ${getMemsStatusLabel(item.memsStatus)}`;

                const statusPillCls = item.isLongDown
                    ? "bg-rose-600/30 text-rose-200 border border-rose-500/50"
                    : (item.memsStatus === 'down'
                        ? "bg-rose-500/15 text-rose-300 border border-rose-500/30"
                        : "bg-amber-500/15 text-amber-300 border border-amber-500/30");

                const barColorCls = item.isLongDown ? "bg-rose-500" : (item.memsStatus === 'down' ? "bg-rose-400" : "bg-amber-400");

                card.innerHTML = `
                    <div class="space-y-2">
                        <div class="flex items-start justify-between gap-2">
                            <div class="flex items-center gap-2">
                                <span class="led-sphere led-${item.memsStatus}" style="width:16px;height:16px;"></span>
                                <span class="font-mono font-black text-sm text-white">${item.id}</span>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${statusPillCls}">${statusLabel}</span>
                            </div>
                            <span class="text-xs font-black ${item.isLongDown ? 'text-rose-300' : 'text-amber-300'} shrink-0">${item.daysDown}d down</span>
                        </div>

                        <div class="flex flex-wrap items-center justify-between gap-1 text-[11px] text-slate-300">
                            <span class="font-bold text-slate-100">${item.type}</span>
                            <span class="text-slate-400">${item.category} • <strong class="text-amber-300/90">${item.location}</strong></span>
                        </div>

                        <p class="text-xs text-slate-300 bg-slate-900/70 border border-slate-800 rounded-lg px-2.5 py-1.5 line-clamp-2">
                            ${item.description || "Active repair / fault investigation in progress"}
                        </p>
                    </div>

                    <div class="space-y-1.5 pt-1 border-t border-slate-800/80">
                        <div class="flex items-center justify-between text-[11px]">
                            <span class="text-slate-400">Since: <strong class="text-slate-200 font-mono">${item.downSince || 'N/A'}</strong>${item.targetDate ? ` • Target: <strong class="text-blue-300 font-mono">${item.targetDate}</strong>` : ''}</span>
                            <span class="font-extrabold text-slate-200">${item.completion}%</span>
                        </div>
                        <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                            <div class="h-full ${barColorCls} transition-all duration-300" style="width:${Math.min(100, Math.max(0, item.completion))}%"></div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function populateDynamicEquipmentTypes(selectedCategory = null) {
            const catSelect = document.getElementById('newAssetCategorySelect');
            const typeSelect = document.getElementById('newAssetTypeSelect');
            if (!catSelect || !typeSelect) return;

            const activeCategory = selectedCategory || catSelect.value || "LIGHT EQUIPMENT";
            const baseTypes = CATEGORY_EQUIPMENT_TYPES[activeCategory] || [];
            const customStateTypes = state
                .filter(r => r.category === activeCategory && !baseTypes.includes(r.type))
                .map(r => r.type);

            const merged = [...baseTypes, ...customStateTypes];

            typeSelect.innerHTML = '';
            merged.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                typeSelect.appendChild(opt);
            });

            const customOpt = document.createElement('option');
            customOpt.value = "__CUSTOM__";
            customOpt.textContent = "+ Custom Equipment Type...";
            typeSelect.appendChild(customOpt);

            handleNewTypeChange(typeSelect.value);
        }

        function handleNewCategoryChange(newCat) {
            populateDynamicEquipmentTypes(newCat);
        }

        function setAddEntryMode(mode) {
            addEntryMode = mode;
            const singleBtn = document.getElementById('modeSingleBtn');
            const bulkBtn = document.getElementById('modeBulkBtn');
            const singleWrap = document.getElementById('singleAssetInputWrapper');
            const bulkWrap = document.getElementById('bulkAssetInputWrapper');

            if (mode === 'single') {
                singleBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-lg bg-blue-600 text-white transition";
                bulkBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition";
                singleWrap.classList.remove('hidden');
                bulkWrap.classList.add('hidden');
            } else {
                bulkBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-lg bg-blue-600 text-white transition";
                singleBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition";
                bulkWrap.classList.remove('hidden');
                singleWrap.classList.add('hidden');
            }
        }

        function handleNewTypeChange(val) {
            const customWrapper = document.getElementById('customEquipTypeWrapper');
            if (val === "__CUSTOM__") {
                customWrapper.classList.remove('hidden');
            } else {
                customWrapper.classList.add('hidden');
            }
        }

        function adjustAddFormDefaults() {
            const stateKey = document.getElementById('newAssetStatus').value;
            const progressInput = document.getElementById('newAssetProgress');
            const downSinceWrap = document.getElementById('newAssetDownSinceWrapper');
            const repairedWrap = document.getElementById('newAssetRepairedDateWrapper');
            const todayStr = getTodayDateString();

            if (stateKey === 'released') {
                progressInput.value = 100;
                progressInput.disabled = true;
                downSinceWrap.classList.add('hidden');
                repairedWrap.classList.add('hidden');
            } else if (stateKey === 'restored') {
                progressInput.value = 100;
                progressInput.disabled = true;
                downSinceWrap.classList.add('hidden');
                repairedWrap.classList.remove('hidden');
                if (!document.getElementById('newAssetRepairedDate').value) {
                    document.getElementById('newAssetRepairedDate').value = todayStr;
                }
            } else if (stateKey === 'waiting') {
                progressInput.value = 15;
                progressInput.disabled = false;
                downSinceWrap.classList.remove('hidden');
                repairedWrap.classList.add('hidden');
                if (!document.getElementById('newAssetDownSince').value) {
                    document.getElementById('newAssetDownSince').value = todayStr;
                }
            } else {
                progressInput.value = 40;
                progressInput.disabled = false;
                downSinceWrap.classList.remove('hidden');
                repairedWrap.classList.add('hidden');
                if (!document.getElementById('newAssetDownSince').value) {
                    document.getElementById('newAssetDownSince').value = todayStr;
                }
            }
        }

        function openAddAssetModal() {
            const catSelect = document.getElementById('newAssetCategorySelect');
            catSelect.value = "LIGHT EQUIPMENT";
            populateDynamicEquipmentTypes("LIGHT EQUIPMENT");
            setAddEntryMode('single');
            document.getElementById('newSingleAssetCode').value = '';
            document.getElementById('newBulkAssetCodes').value = '';
            document.getElementById('newCustomAssetType').value = '';
            document.getElementById('newAssetNotes').value = '';
            const todayStr = getTodayDateString();
            document.getElementById('newAssetTargetDate').value = todayStr;
            document.getElementById('newAssetDownSince').value = todayStr;
            document.getElementById('newAssetRepairedDate').value = todayStr;
            adjustAddFormDefaults();
            openModal('addAssetModal');
            lucide.createIcons();
            setTimeout(() => document.getElementById('newSingleAssetCode').focus(), 60);
        }

        async function handleAddAssetSubmit(e) {
            e.preventDefault();
            const selectedCategory = document.getElementById('newAssetCategorySelect').value;
            let selectedType = document.getElementById('newAssetTypeSelect').value;
            if (selectedType === "__CUSTOM__") {
                selectedType = document.getElementById('newCustomAssetType').value.toUpperCase().trim();
                if (!selectedType) {
                    showToast("Please specify a custom equipment type.", "error");
                    return;
                }
            }

            const location = document.getElementById('newAssetLocation').value;
            const stateKey = document.getElementById('newAssetStatus').value;
            const progress = parseInt(document.getElementById('newAssetProgress').value) || 0;
            const targetDate = document.getElementById('newAssetTargetDate').value;
            const downSince = document.getElementById('newAssetDownSince').value || getTodayDateString();
            const repairedDate = document.getElementById('newAssetRepairedDate').value || getTodayDateString();
            const notes = document.getElementById('newAssetNotes').value.trim();

            let rawCodes = [];
            if (addEntryMode === 'single') {
                const singleVal = document.getElementById('newSingleAssetCode').value.toUpperCase().trim();
                if (!singleVal) {
                    showToast("Please enter an asset number to monitor.", "error");
                    return;
                }
                rawCodes = [singleVal];
            } else {
                const bulkText = document.getElementById('newBulkAssetCodes').value.toUpperCase();
                rawCodes = bulkText
                    .split(/[\n,;]+/)
                    .map(s => s.trim())
                    .filter(Boolean);
                if (rawCodes.length === 0) {
                    showToast("Please enter one or more asset numbers.", "error");
                    return;
                }
            }

            const existingMap = new Map();
            state.forEach(row => {
                const allUnits = [
                    ...(row.ongoing || []), ...(row.pms || []), ...(row.jobout || []),
                    ...(row.waiting || []), ...(row.released || []), ...(row.restored || [])
                ];
                allUnits.forEach(u => existingMap.set(u.id, row.type));
            });

            let row = state.find(item => item.type === selectedType && item.category === selectedCategory);
            if (!row) {
                row = state.find(item => item.type === selectedType);
            }
            if (!row) {
                row = {
                    category: selectedCategory,
                    type: selectedType,
                    released: [],
                    restored: [],
                    waiting: [],
                    pms: [],
                    ongoing: [],
                    jobout: []
                };
                state.push(row);
            }

            if (!row[stateKey]) row[stateKey] = [];
            const isHealthy = (stateKey === 'released' || stateKey === 'restored');
            const isActiveDownOrReported = (stateKey === 'ongoing' || stateKey === 'waiting' || stateKey === 'pms' || stateKey === 'jobout');

            const addedCodes = [];
            const skippedCodes = [];

            rawCodes.forEach(code => {
                if (existingMap.has(code) || addedCodes.includes(code)) {
                    skippedCodes.push(code);
                    return;
                }
                const newUnit = {
                    id: code,
                    completion: isHealthy ? 100 : progress,
                    targetDate: targetDate || null,
                    description: notes || (isHealthy ? (stateKey === 'restored' ? "For Testing" : "Operational") : "Added for monitoring"),
                    location: location
                };
                if (stateKey === 'restored') {
                    newUnit.repairedDate = repairedDate;
                    newUnit.wasLongDown = false;
                    newUnit.priorDowntimeDays = 0;
                }
                if (isActiveDownOrReported) {
                    newUnit.downSince = downSince;
                }
                row[stateKey].push(newUnit);
                addedCodes.push(code);
            });

            if (addedCodes.length === 0) {
                showToast(`Asset number(s) already exist on the monitoring wall: ${skippedCodes.join(', ')}`, "error");
                return;
            }

            populateDynamicEquipmentTypes(selectedCategory);
            renderDashboard();
            closeModal('addAssetModal');

            let msg = `Added ${addedCodes.join(', ')} to ${selectedType} [${selectedCategory}] (${getMemsStatusLabel(getMemsStatusFromStateKey(stateKey))}).`;
            if (skippedCodes.length > 0) {
                msg += ` Skipped existing: ${skippedCodes.join(', ')}.`;
            }
            showToast(msg, "success");
            await saveToSheet();
        }

        function updateProgressDisplay(val) {
            document.getElementById('progressPercentDisplay').textContent = `${val}%`;
        }

        function populateManageEquipmentTypes(category, selectedType = null) {
            const typeSelect = document.getElementById('manageUnitTypeSelect');
            if (!typeSelect) return;
            const baseTypes = CATEGORY_EQUIPMENT_TYPES[category] || [];
            const customStateTypes = state
                .filter(r => r.category === category && !baseTypes.includes(r.type))
                .map(r => r.type);
            const merged = [...baseTypes, ...customStateTypes];

            typeSelect.innerHTML = '';
            merged.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                typeSelect.appendChild(opt);
            });

            if (selectedType && merged.includes(selectedType)) {
                typeSelect.value = selectedType;
            }
        }

        function handleManageCategoryChange(newCat) {
            populateManageEquipmentTypes(newCat);
        }

        function updateManageLongDownPreview() {
            const statusKey = document.getElementById('manageUnitStatus').value;
            const downSinceVal = document.getElementById('manageUnitDownSince').value;
            const previewEl = document.getElementById('manageLongDownPreview');
            const isActiveRepair = (statusKey === 'ongoing' || statusKey === 'waiting' || statusKey === 'pms' || statusKey === 'jobout');

            if (!isActiveRepair) {
                previewEl.textContent = "Not currently down/reported";
                previewEl.className = "text-[10px] font-semibold text-slate-400 mt-1";
                return;
            }

            const days = calculateDaysDown(downSinceVal);
            if (days > LONG_DOWN_THRESHOLD_DAYS) {
                previewEl.textContent = `⚠ AUTO-FLAGGED: ${days} days down (>7 days Long Down)`;
                previewEl.className = "text-[10px] font-black text-rose-400 mt-1";
            } else {
                previewEl.textContent = `Running Repair: ${days} day${days === 1 ? '' : 's'} down (flags at >7d)`;
                previewEl.className = "text-[10px] font-bold text-amber-300 mt-1";
            }
        }

        function openManageModal(category, type, unitCode, stateKey) {
            const row = state.find(item => item.type === type);
            if (!row) return;
            const list = row[stateKey] || [];
            const unit = list.find(u => u.id === unitCode);
            if (!unit) return;

            activeManageState = { category, type, unitCode, stateKey, unitObj: unit };
            deleteConfirmPending = false;
            document.getElementById('deleteUnitBtnText').textContent = "Remove Asset";

            document.getElementById('manageUnitBadge').textContent = unitCode;
            document.getElementById('manageUnitCategoryDisplay').textContent = category;
            document.getElementById('manageUnitTypeDisplay').textContent = type;

            const catSelect = document.getElementById('manageUnitCategorySelect');
            catSelect.value = category;
            populateManageEquipmentTypes(category, type);

            const ledEl = document.getElementById('manageUnitLed');
            ledEl.className = `led-sphere led-${getMemsStatusFromStateKey(stateKey)}`;

            document.getElementById('manageUnitDescription').value = unit.description || '';
            document.getElementById('manageUnitStatus').value = stateKey;
            document.getElementById('manageUnitLocation').value = unit.location || 'GEM Motorpool';

            const todayStr = getTodayDateString();
            document.getElementById('manageUnitDownSince').value = unit.downSince || todayStr;
            document.getElementById('manageUnitRepairedDate').value = unit.repairedDate || todayStr;

            const comp = unit.completion ?? (stateKey === 'released' || stateKey === 'restored' ? 100 : 0);
            updateProgressDisplay(comp);
            document.getElementById('manageUnitProgressSlider').value = comp;
            document.getElementById('manageUnitTargetDate').value = unit.targetDate || "";

            syncManageDateFieldsVisibility(stateKey);
            updateManageLongDownPreview();

            openModal('manageUnitModal');
            lucide.createIcons();
        }

        function syncManageDateFieldsVisibility(statusKey) {
            const downWrap = document.getElementById('manageDownSinceWrapper');
            const repWrap = document.getElementById('manageRepairedDateWrapper');
            const repLabel = document.getElementById('manageRepairedDateLabel');
            const promoHint = document.getElementById('manageRepairedPromotionHint');
            const isActiveRepair = (statusKey === 'ongoing' || statusKey === 'waiting' || statusKey === 'pms' || statusKey === 'jobout');
            const isPromotingFromTesting = (activeManageState.stateKey === 'restored' && statusKey === 'released');
            const isAlreadyRepairedOperational = (statusKey === 'released' && Boolean(activeManageState.unitObj?.isRepaired));

            if (isPromotingFromTesting) {
                promoHint.classList.remove('hidden');
            } else {
                promoHint.classList.add('hidden');
            }

            if (isActiveRepair) {
                downWrap.classList.remove('hidden');
                repWrap.classList.add('hidden');
            } else if (statusKey === 'restored') {
                downWrap.classList.add('hidden');
                repWrap.classList.remove('hidden');
                repLabel.textContent = "Repaired / For Testing Date";
            } else if (isPromotingFromTesting || isAlreadyRepairedOperational) {
                downWrap.classList.add('hidden');
                repWrap.classList.remove('hidden');
                repLabel.textContent = "Repaired Date (Logged)";
            } else {
                downWrap.classList.add('hidden');
                repWrap.classList.add('hidden');
            }
        }

        function handleManageStatusChange(newStatusKey) {
            const slider = document.getElementById('manageUnitProgressSlider');
            const ledEl = document.getElementById('manageUnitLed');
            const todayStr = getTodayDateString();
            ledEl.className = `led-sphere led-${getMemsStatusFromStateKey(newStatusKey)}`;

            if (newStatusKey === 'released' || newStatusKey === 'restored') {
                updateProgressDisplay(100);
                slider.value = 100;
                if ((newStatusKey === 'restored' || activeManageState.stateKey === 'restored') && !document.getElementById('manageUnitRepairedDate').value) {
                    document.getElementById('manageUnitRepairedDate').value = todayStr;
                }
            } else if (newStatusKey === 'waiting') {
                if (slider.value == 100) slider.value = 15;
                updateProgressDisplay(slider.value);
                if (!document.getElementById('manageUnitDownSince').value) {
                    document.getElementById('manageUnitDownSince').value = todayStr;
                }
            } else {
                if (slider.value == 100) slider.value = 40;
                updateProgressDisplay(slider.value);
                if (!document.getElementById('manageUnitDownSince').value) {
                    document.getElementById('manageUnitDownSince').value = todayStr;
                }
            }

            syncManageDateFieldsVisibility(newStatusKey);
            updateManageLongDownPreview();
        }

        async function saveAssetDetailedChanges() {
            const { type, unitCode, stateKey, unitObj } = activeManageState;
            const sourceRow = state.find(item => item.type === type);
            if (!sourceRow || !unitObj) return;

            const newCategory = document.getElementById('manageUnitCategorySelect').value;
            const newType = document.getElementById('manageUnitTypeSelect').value;
            const newStatusKey = document.getElementById('manageUnitStatus').value;
            const newDescription = document.getElementById('manageUnitDescription').value.trim();
            const newTargetDate = document.getElementById('manageUnitTargetDate').value;
            const newLocation = document.getElementById('manageUnitLocation').value;
            const newProgress = parseInt(document.getElementById('manageUnitProgressSlider').value) || 0;
            const newDownSince = document.getElementById('manageUnitDownSince').value || getTodayDateString();
            const newRepairedDate = document.getElementById('manageUnitRepairedDate').value || getTodayDateString();

            const wasActiveRepair = (stateKey === 'ongoing' || stateKey === 'waiting' || stateKey === 'pms' || stateKey === 'jobout');
            const wasForTesting = (stateKey === 'restored');
            const previousDownSince = unitObj.downSince || '';

            sourceRow[stateKey] = (sourceRow[stateKey] || []).filter(u => u.id !== unitCode);

            let targetRow = state.find(item => item.type === newType);
            if (!targetRow) {
                targetRow = {
                    category: newCategory,
                    type: newType,
                    released: [], restored: [], waiting: [], pms: [], ongoing: [], jobout: []
                };
                state.push(targetRow);
            }
            targetRow.category = newCategory;

            const isNowHealthy = (newStatusKey === 'released' || newStatusKey === 'restored');
            const isNowActiveRepair = (newStatusKey === 'ongoing' || newStatusKey === 'waiting' || newStatusKey === 'pms' || newStatusKey === 'jobout');

            unitObj.description = newDescription;
            unitObj.targetDate = newTargetDate;
            unitObj.location = newLocation;
            unitObj.completion = isNowHealthy ? 100 : newProgress;

            let promotedToOperationalAsRepaired = false;

            if (newStatusKey === 'restored') {
                unitObj.repairedDate = newRepairedDate;
                if (wasActiveRepair && previousDownSince) {
                    const resolvedDays = calculateDaysBetween(previousDownSince, newRepairedDate);
                    unitObj.priorDowntimeDays = resolvedDays;
                    unitObj.wasLongDown = resolvedDays > LONG_DOWN_THRESHOLD_DAYS;
                } else if (typeof unitObj.priorDowntimeDays !== 'number') {
                    unitObj.priorDowntimeDays = 0;
                    unitObj.wasLongDown = false;
                }
                delete unitObj.downSince;
            } else if (newStatusKey === 'released') {
                delete unitObj.downSince;
                // When an asset in "For Testing" updates to "Operational", include it as Repaired in REPAIRED/FOR TESTING ASSETS - DAILY & MONTHLY LOG
                if (wasForTesting || unitObj.isRepaired) {
                    promotedToOperationalAsRepaired = wasForTesting;
                    unitObj.isRepaired = true;
                    unitObj.repairedDate = newRepairedDate || unitObj.repairedDate || getTodayDateString();
                    if (typeof unitObj.priorDowntimeDays !== 'number') {
                        unitObj.priorDowntimeDays = 0;
                    }
                    if (typeof unitObj.wasLongDown !== 'boolean') {
                        unitObj.wasLongDown = unitObj.priorDowntimeDays > LONG_DOWN_THRESHOLD_DAYS;
                    }
                    if (!unitObj.description || unitObj.description === "For Testing") {
                        unitObj.description = "Repaired & Operational (Passed Testing)";
                    } else if (wasForTesting && /for testing/i.test(unitObj.description)) {
                        unitObj.description = unitObj.description.replace(/for testing/ig, "Repaired & Operational");
                    }
                }
            } else if (isNowActiveRepair) {
                unitObj.downSince = newDownSince;
                delete unitObj.repairedDate;
                delete unitObj.wasLongDown;
                delete unitObj.priorDowntimeDays;
                delete unitObj.isRepaired;
            }

            if (!targetRow[newStatusKey]) targetRow[newStatusKey] = [];
            targetRow[newStatusKey].push(unitObj);

            renderDashboard();
            closeModal('manageUnitModal');

            if (promotedToOperationalAsRepaired) {
                showToast(`${unitCode} (${newType}) updated to Operational & logged as Repaired in Daily & Monthly Log.`, "success");
            } else {
                showToast(`Updated ${unitCode} (${newType}) → ${getMemsStatusLabel(getMemsStatusFromStateKey(newStatusKey))}`, "success");
            }
            await saveToSheet();
        }

        async function handleDeleteUnitClick() {
            if (!deleteConfirmPending) {
                deleteConfirmPending = true;
                document.getElementById('deleteUnitBtnText').textContent = "Click Again to Confirm";
                return;
            }
            const { type, unitCode, stateKey } = activeManageState;
            const row = state.find(item => item.type === type);
            if (!row) return;

            row[stateKey] = (row[stateKey] || []).filter(u => u.id !== unitCode);

            renderDashboard();
            closeModal('manageUnitModal');
            showToast(`Removed asset ${unitCode} from monitoring.`, "info");
            await saveToSheet();
        }

        function downloadCSV() {
            let csvContent = "data:text/csv;charset=utf-8,Category,Equipment Type,Asset Number,LED Status,Repaired Log Status,Long Down (>7d),Days Down / Prior Downtime,Down Since,Repaired Date,Repaired Month,Location,Completion,Target Date,Remarks\n";
            state.forEach(row => {
                const allLists = [
                    { list: row.released || [], status: "Operational", memsStatus: "available" },
                    { list: row.restored || [], status: "For Testing", memsStatus: "restored" },
                    { list: row.waiting || [], status: "Reported", memsStatus: "reported" },
                    { list: row.pms || [], status: "Reported", memsStatus: "reported" },
                    { list: row.ongoing || [], status: "Down", memsStatus: "down" },
                    { list: row.jobout || [], status: "Down", memsStatus: "down" }
                ];
                allLists.forEach(({ list, status, memsStatus }) => {
                    list.forEach(u => {
                        const desc = (u.description || "").replace(/,/g, " ");
                        const comp = u.completion ?? (status === "Operational" || status === "For Testing" ? 100 : 0);
                        const isActiveRepair = (memsStatus === "down" || memsStatus === "reported");
                        const daysDown = isActiveRepair ? calculateDaysDown(u.downSince) : (u.priorDowntimeDays || 0);
                        const isLongDown = isActiveRepair
                            ? (daysDown > LONG_DOWN_THRESHOLD_DAYS)
                            : Boolean(u.wasLongDown);
                        const repLogStatus = memsStatus === "restored"
                            ? "FOR TESTING"
                            : (memsStatus === "available" && u.isRepaired ? "REPAIRED (OPERATIONAL)" : "");
                        const repDate = u.repairedDate || '';
                        const repMonth = repDate.length >= 7 ? repDate.slice(0, 7) : '';
                        csvContent += `"${row.category}","${row.type}","${u.id}","${status}","${repLogStatus}","${isLongDown ? 'YES' : 'NO'}",${daysDown},"${u.downSince || ''}","${repDate}","${repMonth}","${u.location || 'GEM Motorpool'}",${comp}%,"${u.targetDate || ''}","${desc}"\n`;
                    });
                });
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `logistics_fleet_monitoring_${getTodayDateString()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("Logistics Fleet Monitoring CSV exported successfully.", "success");
        }
    </script>
</body>
</html>
