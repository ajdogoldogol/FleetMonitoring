    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxymo1wum7Gg4bxsMweu6IoxxG6BRCzrWVSBws0nuEtLzaLDp3ReC7UU3DG1UPc4zgyYg/exec";
        const LEGACY_STORAGE_KEY = "fleet_monitoring_ledger_v4";
        const LOCAL_STORAGE_KEY = "logistics_fleet_monitoring_ledger_v5";
        const LONG_DOWN_THRESHOLD_DAYS = 7;

        // Date helpers using local calendar date YYYY-MM-DD
        function getTodayDateString() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getCurrentMonthString() {
            return getTodayDateString().slice(0, 7);
        }

        function getDaysAgoDateString(daysAgo) {
            const dt = new Date();
            dt.setHours(0, 0, 0, 0);
            dt.setDate(dt.getDate() - daysAgo);
            const y = dt.getFullYear();
            const m = String(dt.getMonth() + 1).padStart(2, '0');
            const d = String(dt.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function calculateDaysBetween(startStr, endStr = null) {
            if (!startStr) return 0;
            const sParts = startStr.split('-').map(Number);
            if (sParts.length !== 3 || sParts.some(isNaN)) return 0;
            const start = new Date(sParts[0], sParts[1] - 1, sParts[2]);

            let end;
            if (endStr) {
                const eParts = endStr.split('-').map(Number);
                if (eParts.length === 3 && !eParts.some(isNaN)) {
                    end = new Date(eParts[0], eParts[1] - 1, eParts[2]);
                }
            }
            if (!end) {
                const now = new Date();
                end = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            }

            const diffMs = end.getTime() - start.getTime();
            return Math.max(0, Math.floor(diffMs / (1000 * 60 * 60 * 24)));
        }

        function calculateDaysDown(downSinceStr) {
            return calculateDaysBetween(downSinceStr, null);
        }

        function formatMonthLabel(monthStr) {
            if (!monthStr || monthStr.length < 7) return "Unknown Month";
            const [y, m] = monthStr.split('-').map(Number);
            if (!y || !m) return monthStr;
            const dt = new Date(y, m - 1, 1);
            return dt.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        }

        function formatFullDateWithMonth(dateStr) {
            if (!dateStr) return "N/A";
            const parts = dateStr.split('-').map(Number);
            if (parts.length !== 3 || parts.some(isNaN)) return dateStr;
            const dt = new Date(parts[0], parts[1] - 1, parts[2]);
            return dt.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
        }

